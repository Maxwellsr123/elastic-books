<title>Privacy Policy — Elastic Admin</title>
<!--
  Canonical privacy policy lives on the marketing site: https://elasticadmin.com/privacy

  This page used to hold a SECOND, separately-maintained copy of the policy. The
  two had already drifted — the marketing one is longer, has the full Google
  Limited Use bullets, and is the one the OAuth consent screen points at. Two
  divergent privacy policies is a live compliance hazard (a Google reviewer
  finding the weaker one is a rejection), so this is now a redirect.

  Edit the policy in ONE place: the marketing site. See docs/PRIVACY_POLICY_SOURCE.md
-->
<link rel="canonical" href="https://elasticadmin.com/privacy">
<meta http-equiv="refresh" content="0; url=https://elasticadmin.com/privacy">
<script>location.replace("https://elasticadmin.com/privacy");</script>
<style>
  body{background:#F7F7F4;color:#141418;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;padding:60px 18px;margin:0}
  main{max-width:520px;margin:0 auto;text-align:center}
  a{color:#5B54E6;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
  <p>Our privacy policy has moved to
  <a href="https://elasticadmin.com/privacy">elasticadmin.com/privacy</a>.</p>
  <p>Redirecting you now…</p>
</main>
</body>
