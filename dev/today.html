<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today — Ava</title>
<script>window.IS_DEV=/(^|\/)dev(\/|$)/.test(location.pathname)||new URLSearchParams(location.search).get("env")==="dev";window.SANDBOX_CO="8449f5d6-a12f-4238-88e3-4ae6e3e1dac5";if(window.IS_DEV)document.addEventListener("DOMContentLoaded",function(){var b=document.getElementById("envbadge");if(b){b.textContent="DEV";b.style.background="#bbf7d0";b.style.color="#166534";}document.title="DEV · "+document.title;});</script>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.30.0/tabler-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAF8F4;--card:#fff;--line:#D9D9CC;--ink:#141418;--ink2:#67676E;--ink3:#9CA3AF;
--ind:#534AB7;--ind2:#6F66DB;--indbg:#EEEDFE;--indtx:#3F3795;
--grn:#0E7A50;--grnbg:#E7F6EE;--amb:#9A5B12;--ambbg:#FBF1E2;--blu:#175CD3;--blubg:#EFF6FF;--red:#B42318;--redbg:#FEF3F2;--org:#FF6A1A;--ink0:#100F15}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.app{display:flex;min-height:100vh}
.side{width:212px;flex:none;background:var(--ink0);color:#fff;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;gap:2px}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
.lg{width:28px;height:28px;border-radius:5px;background:linear-gradient(135deg,var(--ind),var(--ind2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:4px;color:#A7A7B4;text-decoration:none;font-size:13px;font-weight:500}
.side a:hover{background:#1F1E26;color:#fff}
.side a.on{background:#262533;color:#fff;box-shadow:inset 2px 0 0 var(--ind2)}
.side a i{font-size:17px}
.side .n{margin-left:auto;font-size:11px;font-weight:700;background:#33313f;color:#cfccdb;padding:1px 7px;border-radius:9px;font-variant-numeric:tabular-nums}
.side .n.hot{background:var(--ambbg);color:var(--amb)}
.side .grp{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#5f5c70;padding:14px 10px 5px}
.side .foot{margin-top:auto;padding:10px;font-size:11.5px;color:#77748a}
.side .foot a{padding:0;color:#8B8B98;display:inline}
.main{flex:1;min-width:0}
.wrap{max-width:840px;padding:22px 26px 70px}
.ask{display:flex;align-items:center;gap:11px;border:1px solid #C9C4F2;border-radius:6px;padding:11px 13px;background:#fff;cursor:text}
.ask input{flex:1;border:0;outline:0;font:inherit;font-size:14.5px;background:transparent}
.ask input::placeholder{color:var(--ink3)}
.mic{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--ind),var(--ind2));color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px;cursor:pointer}
h1{font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.hdr{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:22px 0 0}
.hdr .s{font-size:12.5px;color:var(--ink2)}
.hdr .when{margin-left:auto;font-size:12.5px;color:var(--ink3)}
.note{margin-top:10px;background:var(--indbg);border:1px solid #C9C4F2;border-radius:6px;padding:11px 14px;font-size:13.5px;line-height:1.55;color:var(--indtx);display:flex;gap:10px}
.list{background:#fff;border:1px solid var(--line);border-radius:6px;margin-top:14px;overflow:hidden}
.itm{padding:15px 17px;border-top:1px solid var(--line)}
.itm:first-child{border-top:0}
.irow{display:flex;gap:13px;align-items:flex-start}
.ibody{flex:1;min-width:0}
.thr{margin-top:2px}
.reply{border-top:1px solid var(--line);padding:12px 13px;background:#FCFCF9;display:flex;flex-direction:column;gap:9px}
.reply .rtx{width:100%;border:1px solid var(--line);border-radius:5px;padding:10px 11px;font:inherit;font-size:13.5px;resize:vertical;outline:none;background:#fff}
.reply .rtx:focus{border-color:var(--ind);box-shadow:0 0 0 3px rgba(83,74,183,.09)}
.own{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.ol{font-size:12px;font-weight:600;color:var(--ink3);cursor:pointer;white-space:nowrap}
.ol:hover{color:var(--ink)}
.clrbar{margin-top:10px;font-size:12.5px;color:var(--ink3);display:flex;gap:7px;flex-wrap:wrap;align-items:baseline}
.clrbar .ol{color:var(--indtx)}
.jump{display:flex;gap:8px;flex-wrap:wrap}
.jump .btn{flex:1;min-width:150px;justify-content:center}
.racts{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.reply .rtx[data-mode="send"]{border-color:var(--ind);background:#fff}
.rmsg{font-size:12.5px;color:var(--ink2)}
.rank{width:22px;height:22px;border-radius:50%;background:var(--ink0);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.rank.q{background:#EFEFE8;color:var(--ink3)}
.ic{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.h{font-weight:600;font-size:14.5px;line-height:1.35}
.d{font-size:13.5px;color:var(--ink2);margin-top:3px;line-height:1.55}
.why{font-size:12px;color:var(--ink3);margin-top:6px;display:flex;align-items:center;gap:6px}
.acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.btn{font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:3px;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--org);border-color:var(--org);color:#fff}.btn.p:hover{background:#D2530F}
.pill{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:2px;white-space:nowrap}
.p-amb{background:var(--ambbg);color:var(--amb)}.p-red{background:var(--redbg);color:var(--red)}
.p-grn{background:var(--grnbg);color:var(--grn)}.p-ind{background:var(--indbg);color:var(--indtx)}
.p-mut{background:#EFEFE8;color:var(--ink3)}
.quiet{background:#FCFCF9}
.num{font-variant-numeric:tabular-nums}
.sec{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:26px 0 0;display:flex;align-items:center;gap:8px}
.sec .c{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;color:var(--ink3)}
.use{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.u{background:#fff;border:1px solid var(--line);border-radius:6px;padding:13px 15px}
.u .k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.u .n{font-size:21px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.u .t{font-size:12px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.feats{margin-top:10px;font-size:12.5px;color:var(--ink3);line-height:1.7}
.feats b{color:var(--ink2);font-weight:600}
.wip{display:flex;gap:11px;align-items:flex-start;background:var(--ambbg);border:1px solid #EBD7B4;color:#7A4A10;border-radius:6px;padding:11px 14px;font-size:13px;line-height:1.55;margin-bottom:12px}
.wip i{font-size:17px;position:relative;top:1px}
.wip b{color:#5E3808}
.wip .x{margin-left:auto;cursor:pointer;font-size:17px;line-height:1;opacity:.6;padding:0 2px}
.wip .x:hover{opacity:1}
/* a little life: the list arrives rather than appearing, and Ava reads as awake */
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.list .itm{animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
.list .itm:nth-child(2){animation-delay:.05s}.list .itm:nth-child(3){animation-delay:.1s}
.list .itm:nth-child(4){animation-delay:.15s}.list .itm:nth-child(n+5){animation-delay:.2s}
.itm .rank{transition:transform .15s}
.list .itm:hover{background:#FEFEFC}
.list .itm:hover .rank{transform:scale(1.12)}
.btn{transition:transform .12s,background .12s,border-color .12s}
.btn:active{transform:scale(.97)}
.note{animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(83,74,183,.34)}50%{box-shadow:0 0 0 7px rgba(83,74,183,0)}}
.mic{animation:breathe 2.8s ease-in-out infinite}
.mic:active{transform:scale(.94)}
.ask{transition:border-color .15s,box-shadow .15s}
.ask:focus-within,.ask:hover{border-color:var(--ind);box-shadow:0 0 0 3px rgba(83,74,183,.09)}
.u{transition:transform .14s,border-color .14s}
.u:hover{transform:translateY(-2px);border-color:#C9C4F2}
@media(prefers-reduced-motion:reduce){.list .itm,.note{animation:none}.mic{animation:none}}
@media(max-width:820px){
  html,body{overflow-x:hidden;max-width:100vw}
  .app{flex-direction:column}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex-direction:row;padding:5px 6px;z-index:30;overflow-x:auto;gap:3px}
  .brand,.side .grp,.side .foot{display:none}
  .side a{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 9px;text-align:center;white-space:nowrap}
  .side .n{margin:0}
  .main{width:100%;padding-bottom:64px}
  .wrap{padding:16px 13px 40px}
  .use{grid-template-columns:1fr 1fr}
  /* A thread squeezed into the text column got about half the screen, with the
     quoted email scrolling inside it. On a phone the row header stays compact
     and everything else takes the full width of the card. */
  .itm{padding:14px 13px}
  .irow{flex-wrap:wrap;gap:10px}
  .ibody{flex-basis:100%;order:3;min-width:100%}
  .irow .pill{order:2;margin-left:auto}
  .rank,.ic{order:1}
  .thr{margin-left:-13px;margin-right:-13px}
  .thr>div{border-radius:0!important;border-left:0!important;border-right:0!important}
  .acts .btn{flex:1;justify-content:center;min-height:42px}
}
</style>
</head>
<body>
<div class="app">

  <main class="main"><div class="wrap">
    <div class="wip" id="wip">
      <i class="ti ti-tools"></i>
      <div><b>Today is under construction.</b> Ava can talk about your work and answer questions here — she can&rsquo;t action things for you yet. The boards below her do everything they always did.</div>
      <span class="x" id="wipx" title="Hide">&times;</span>
    </div>
    <div class="ask" id="askbox">
      <input id="askin" placeholder="Tell Ava what to do…">
      <div class="mic" id="micbtn" title="Tap to record a voice note"><i class="ti ti-microphone"></i></div>
    </div>

    <div class="hdr"><h1 id="hd">Loading…</h1><div class="s" id="hs"></div><div class="when" id="hw"></div></div>
    <div class="note" id="tnote" style="display:none"><i class="ti ti-arrow-badge-down" style="font-size:17px;position:relative;top:1px"></i><div id="tnotet"></div></div>
    <div id="needs"></div>
    <div id="clr"></div>

    <div class="sec" id="hsec" style="display:none">Handled <span class="c">running — nothing needed from you</span></div>
    <div id="handled"></div>

    <div class="sec">What Ava's done <span class="c">tasks and tokens</span></div>
    <div class="use" id="use"></div>
    <div class="feats" id="feats"></div>
  </div></main>
</div>

<script>
(function(){
  var API="https://somgalhkmptkclgvxhca.supabase.co/functions/v1";
  var CO=(new URLSearchParams(location.search).get("c"))||(window.IS_DEV?window.SANDBOX_CO:(function(){
    try{var s=JSON.parse(localStorage.getItem("ava_session")||"null");if(s&&s.companies&&s.companies.length)return s.companies[0].id;}catch(e){}
    location.replace("index.html");return "";})());
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function money(n){return "$"+Math.round(Number(n)||0).toLocaleString("en-NZ");}
  function tok(n){n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"k":String(n);}
  var TONE={red:["p-red","var(--redbg)","var(--red)"],amb:["p-amb","var(--ambbg)","var(--amb)"],
            ind:["p-ind","var(--indbg)","var(--indtx)"],grn:["p-grn","var(--grnbg)","var(--grn)"],
            mut:["p-mut","#EFEFE8","var(--ink3)"]};
  var TIER_TONE={blocked:"red",waiting_on_you:"amb",holding_books:"ind"};
  var TIER_ICON={blocked:"ti-alert-triangle",waiting_on_you:"ti-message-2",holding_books:"ti-help-circle"};
  var HICON={checks:"ti-checks",inbox:"ti-inbox",clock:"ti-clock",happy:"ti-mood-happy",pig:"ti-pig-money"};

  function render(d){
    if(!d||d.error){document.getElementById("hd").textContent="Couldn't load your day — refresh to retry.";return;}
    var needs=d.needs||[],handled=d.handled||[],b=d.boards||{};

    // ── the shared nav keeps the boards one click away; we own the counts ──
    var bk=b.bookkeeping||{};
    if(window.avaNav){
      avaNav.company(d.company||"");
      avaNav.counts({today:needs.length,books:(bk.ready||0)+(bk.owner||0),
                     collect:b.collect?(b.collect.active||0):0});
    }

    document.getElementById("hd").textContent=needs.length?(needs.length===1?"One thing needs you":needs.length+" things need you"):"Nothing needs you";
    document.getElementById("hs").textContent=needs.length?"· everything else is handled":"· Ava's got the lot";
    document.getElementById("hw").textContent=new Date().toLocaleDateString("en-NZ",{weekday:"short",day:"numeric",month:"short"})+", "+new Date().toLocaleTimeString("en-NZ",{hour:"numeric",minute:"2-digit"});
    if(d.note){document.getElementById("tnote").style.display="";document.getElementById("tnotet").textContent=d.note;}

    // ── the triage: ranked by the server, never reordered here ──
    document.getElementById("needs").innerHTML=needs.length?'<div class="list">'+needs.map(function(x,i){
      var tone=TONE[TIER_TONE[x.tier]||"ind"];
      var acts=(x.actions||[]).map(function(a){
        if(a.act==="thread")
          return '<a class="btn'+(a.primary?" p":"")+' athr" data-chase="'+esc(a.chase)+'">'+esc(a.label)+'</a>';
        var href=a.external?a.href:(a.href||x.board||"index.html");
        if(!a.external)href+=(href.indexOf("?")>=0?"&":"?")+"c="+CO;
        return '<a class="btn'+(a.primary?" p":"")+'" href="'+esc(href)+'"'+(a.external?' target="_blank" rel="noopener"':'')+'>'+esc(a.label)+(a.external?' <i class="ti ti-external-link"></i>':'')+'</a>';
      }).join("");
      return '<div class="itm">'
        +'<div class="irow"><div class="rank">'+(i+1)+'</div>'
        +'<div class="ic" style="background:'+tone[1]+';color:'+tone[2]+'"><i class="ti '+(TIER_ICON[x.tier]||"ti-point")+'"></i></div>'
        +'<div class="ibody"><div class="h">'+esc(x.title)+'</div>'
        +'<div class="d">'+esc(x.detail)+'</div>'
        +'<div class="why"><i class="ti ti-arrow-narrow-right"></i> '+esc(x.tier_why)+'</div>'
        +'<div class="acts">'+acts+'</div>'
        +'<div class="own">'
        +(x.snoozed
          ?'<a class="ol" data-act="restore" data-id="'+esc(x.id)+'">↑ Bring back up</a>'
          :'<a class="ol" data-act="later" data-id="'+esc(x.id)+'" data-sig="'+esc(x.signature||"")+'">↓ Push to the back</a>')
        +'<a class="ol" data-act="clear" data-id="'+esc(x.id)+'" data-sig="'+esc(x.signature||"")+'">✕ Clear from the board</a>'
        +'</div></div>'
        +'<span class="pill '+tone[0]+'">'+esc(x.tier_label)+(x.snoozed?' · later':'')+'</span></div>'
        +'<div class="thr" id="thr-'+esc(x.id)+'" style="display:none"></div></div>';
    }).join("")+'</div>'
      :'<div class="list"><div class="itm"><div class="ic" style="background:var(--grnbg);color:var(--grn)"><i class="ti ti-circle-check"></i></div>'
       +'<div style="flex:1"><div class="h">Nothing needs you right now</div><div class="d">Everything’s either running or waiting on someone else. I’ll put it here the moment that changes.</div></div></div></div>';

    // ── below the line: running, unranked, so the top stays short ──
    // Cleared things aren't gone-gone — you can always see what you shifted.
    var cl=d.cleared||[];
    document.getElementById("clr").innerHTML=cl.length
      ?'<div class="clrbar">'+cl.length+' cleared from the board · '
        +cl.map(function(c){return '<a class="ol" data-act="restore" data-id="'+esc(c.id)+'">'+esc(c.title.slice(0,38))+'</a>';}).join(" · ")
        +'</div>':"";

    if(handled.length){
      document.getElementById("hsec").style.display="";
      document.getElementById("handled").innerHTML='<div class="list">'+handled.map(function(x){
        var tone=TONE[x.tone||"mut"];
        return '<div class="itm quiet"><div class="irow"><div class="rank q">·</div>'
          +'<div class="ic" style="background:'+tone[1]+';color:'+tone[2]+'"><i class="ti '+(HICON[x.icon]||"ti-point")+'"></i></div>'
          +'<div class="ibody"><div class="h" style="font-weight:500">'+esc(x.title)+'</div><div class="d">'+esc(x.detail)+'</div></div>'
          +(x.board?'<a class="btn" href="'+esc(x.board)+'?c='+CO+'">Open</a>':'')+'</div></div>';
      }).join("")+'</div>';
    }

    // ── tasks and tokens: day, week, month, year ──
    var u=d.usage||{};
    document.getElementById("use").innerHTML=[["day","Today"],["week","This week"],["month","This month"],["year","This year"]]
      .map(function(p){var v=u[p[0]]||{};
        return '<div class="u"><div class="k">'+p[1]+'</div><div class="n">'+(Number(v.tasks)||0).toLocaleString("en-NZ")+'</div>'
          +'<div class="t">tasks · '+tok(v.tokens)+' tokens</div></div>';}).join("");
    var tf=(u.top_features||[]);
    document.getElementById("feats").innerHTML=tf.length
      ?'Busiest this year: '+tf.map(function(f){return '<b>'+esc(f.feature)+'</b> '+(Number(f.tasks)||0).toLocaleString("en-NZ");}).join(" · ")
      :"";
  }

  // ── the owner's own say on the order ────────────────────────────────────
  // Ava ranks it; you get the last word. "Later" drops one to the bottom,
  // "Clear" takes it off the board — and neither touches the chase itself, so
  // tidying your screen never changes what Ava does next.
  document.addEventListener("click",function(e){
    var o=e.target.closest&&e.target.closest(".ol");
    if(!o)return;
    e.preventDefault();
    var act=o.getAttribute("data-act");
    if(act==="clear"&&!confirm("Clear this off your board?\n\nAva keeps working on it — this just stops it asking you. It comes back if anything changes."))return;
    o.textContent="…";
    fetch(API+"/ava-triage",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({company_id:CO,item_id:o.getAttribute("data-id"),action:act,
                           signature:o.getAttribute("data-sig")||undefined})})
      .then(function(){return fetch(API+"/ava-triage?company="+CO);})
      .then(function(r){return r.json();}).then(render)
      .catch(function(){o.textContent="Didn't save";});
  });

  // ── read the thread where you're standing ───────────────────────────────
  // "Read the thread" used to drop you on the Auto Collect board to go find it
  // yourself, which isn't help (Max, 31 Jul). Same /auto-collect?thread= the
  // boards use; it opens under the item that asked for it.
  var EMOJI={moneybag:"💰",email:"✉️",raised_hand:"✋",speech_balloon:"💬",telephone_receiver:"📞",
    tada:"🎉",warning:"⚠️",mag:"🔍",date:"📅",mailbox_with_mail:"📬",no_entry_sign:"🚫",bell:"🔔",calendar:"📅",eyes:"👀"};
  function slackToHtml(raw){
    var links=[],t=String(raw||"");
    t=t.replace(/<(https?:\/\/[^>|]+)(?:\|([^>]*))?>/g,function(m,u,l){
      links.push('<a href="'+u.replace(/"/g,"&quot;")+'" target="_blank" rel="noopener">'+esc(l||u)+'</a>');return "@@LNK"+(links.length-1)+"@@";});
    t=t.replace(/<mailto:([^>|]+)(?:\|([^>]*))?>/g,function(m,a2,l){links.push(esc(l||a2));return "@@LNK"+(links.length-1)+"@@";});
    t=t.replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&amp;/g,"&").replace(/\[cid:[^\]]+\]/g,"");
    t=esc(t).replace(/@@LNK(\d+)@@/g,function(m,i){return links[Number(i)];})
      .replace(/:([a-z0-9_+-]+):/g,function(m,n){return EMOJI[n]||"";})
      .replace(/\*([^*\n]+)\*/g,"<b>$1</b>");
    var out="",q=[];
    function flush(){if(!q.length)return;
      out+='<div style="border-left:3px solid var(--line);background:var(--bg);padding:8px 11px;margin:6px 0;max-height:min(260px,45vh);overflow:auto;font-size:12.5px;color:var(--ink2);white-space:pre-wrap;word-break:break-word">'+q.join("\n").trim()+'</div>';q=[];}
    t.split("\n").forEach(function(l){
      if(/^(&gt;|>)\s?/.test(l)){q.push(l.replace(/^(&gt;|>)\s?/,""));return;}
      flush();if(l.trim())out+='<div style="margin:3px 0">'+l+'</div>';});
    flush();return out;
  }
  function when(at){if(!at)return "";var dt=new Date(at),n=Math.floor((Date.now()-dt.getTime())/864e5);
    return dt.toLocaleDateString("en-NZ",{day:"numeric",month:"short"})+" · "+(n<=0?"today":n===1?"yesterday":n+"d ago");}
  function threadHtml(t,chase){
    if(!t||!t.ok)return '<div class="d" style="color:var(--amb)">'+esc((t&&t.error)||"Couldn\'t load it.")+'</div>';
    if(!(t.messages||[]).length)return '<div class="d">Nothing in the thread yet.</div>';
    return '<div style="border:1px solid var(--line);border-radius:6px;padding:2px 13px;margin-top:10px;background:#fff">'
      +t.messages.map(function(m){
        var who=m.from==="ava"?'<span style="color:var(--indtx)">Ava</span>'
          :m.from==="customer"?'<span style="color:var(--grn)">'+esc(t.customer||"Them")+'</span>'
          :'<span style="color:var(--ink2)">In Slack</span>';
        return '<div style="padding:10px 0;border-top:1px solid var(--line)">'
          +'<div style="display:flex;font-size:11.5px;font-weight:700;color:var(--ink3);margin-bottom:3px">'+who
          +'<span style="margin-left:auto;font-weight:500">'+when(m.at)+'</span></div>'
          +'<div style="font-size:13px;line-height:1.55">'+slackToHtml(m.text)+'</div></div>';
      }).join("")
      // Reading it and then having to go find it in Gmail to answer is half a
      // feature. Reply here, from your own mailbox, into the same thread.
      +'<div class="reply">'
      // The two places you'd go from here: the email thread, and the invoice
      // itself if something on it needs fixing.
      +((t.gmail_url||t.xero_invoice_url)?'<div class="jump">'
        +(t.gmail_url?'<a class="btn" href="'+esc(t.gmail_url)+'" target="_blank" rel="noopener"><i class="ti ti-brand-gmail"></i> Open in Gmail <i class="ti ti-external-link"></i></a>':'')
        +(t.xero_invoice_url?'<a class="btn" href="'+esc(t.xero_invoice_url)+'" target="_blank" rel="noopener"><i class="ti ti-file-invoice"></i> Open in Xero <i class="ti ti-external-link"></i></a>':'')
        +(t.xero_contact_url?'<a class="btn" href="'+esc(t.xero_contact_url)+'" target="_blank" rel="noopener"><i class="ti ti-user"></i> Their contact <i class="ti ti-external-link"></i></a>':'')
        +'</div>':'')
      +(t.can_reply
        ?'<textarea class="rtx" rows="2" data-chase="'+esc(chase||"")+'" data-mode="instruct" placeholder="Tell Ava what you want '+esc(t.customer||"them")+' to hear—she\'ll draft it for you to check first."></textarea>'
         +'<div class="racts"><button class="btn p rgo" data-chase="'+esc(chase||"")+'">Draft it</button>'
         +'<span class="rmsg"></span></div>'
        :'<div class="d">No email address on this customer, so there\'s nothing to reply to yet.</div>')
      +'</div></div>';
  }
  document.addEventListener("click",function(e){
    var rg=e.target.closest&&e.target.closest(".rgo");
    if(rg){
      var wrap=rg.closest(".reply"),ta=wrap.querySelector(".rtx"),msg=wrap.querySelector(".rmsg");
      var chase=rg.getAttribute("data-chase");
      var mode=ta.getAttribute("data-mode");

      if(mode==="instruct"){
        var instruction=(ta.value||"").trim();
        if(!instruction){msg.textContent="Tell Ava what you want it to say.";return;}
        rg.disabled=true;rg.textContent="Drafting…";msg.textContent="";
        fetch(API+"/auto-collect",{method:"POST",headers:{"content-type":"application/json"},
          body:JSON.stringify({company_id:CO,action:"draft",chase_id:chase,instruction:instruction})})
          .then(function(r){return r.json();})
          .then(function(o){
            rg.disabled=false;
            if(o&&o.ok){
              ta.value=o.draft;ta.setAttribute("data-mode","send");ta.rows=Math.max(4,Math.ceil(o.draft.length/60));
              rg.textContent="Send this";rg.className="btn p rgo";
              msg.innerHTML='<i class="ti ti-pencil" style="vertical-align:-2px"></i> Check it, edit anything, then send.';
            }else{
              rg.textContent="Draft it";
              msg.innerHTML='<span style="color:var(--red)">'+esc((o&&o.error)||"Couldn\'t draft that.")+'</span>';
            }
          })
          .catch(function(){rg.disabled=false;rg.textContent="Draft it";msg.innerHTML='<span style="color:var(--red)">Couldn\'t reach it.</span>';});
        return;
      }

      // mode === "send": this is the reviewed draft, sent exactly as it reads.
      var text=(ta.value||"").trim();
      if(!text){msg.textContent="There's nothing to send.";return;}
      rg.disabled=true;rg.textContent="Sending…";msg.textContent="";
      fetch(API+"/auto-collect",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({company_id:CO,action:"reply",chase_id:chase,text:text})})
        .then(function(r){return r.json();})
        .then(function(o){
          rg.disabled=false;
          if(o&&o.ok){
            ta.value="";ta.setAttribute("data-mode","instruct");ta.rows=2;rg.textContent="Draft it";
            msg.innerHTML='<b style="color:var(--grn)">Sent</b> from '+esc(o.sent_from)+'.';
          }else{
            rg.textContent="Send this";
            msg.innerHTML='<span style="color:var(--red)">'+esc((o&&o.error)||"Didn\'t send.")+'</span>';
          }
        })
        .catch(function(){rg.disabled=false;rg.textContent="Send this";msg.innerHTML='<span style="color:var(--red)">Couldn\'t reach it.</span>';});
      return;
    }
    var a=e.target.closest&&e.target.closest(".athr");
    if(!a)return;
    e.preventDefault();
    var box=a.closest(".itm").querySelector(".thr");
    if(box.style.display!=="none"){box.style.display="none";a.textContent=a.getAttribute("data-lbl")||"Read the thread";return;}
    box.style.display="";
    if(!a.getAttribute("data-lbl"))a.setAttribute("data-lbl",a.textContent);
    a.textContent="Hide the thread";
    if(box.getAttribute("data-loaded"))return;
    box.innerHTML='<div class="d">Loading…</div>';
    var chase=a.getAttribute("data-chase");
    fetch(API+"/auto-collect?company="+CO+"&thread="+chase)
      .then(function(r){return r.json();})
      .then(function(t){box.setAttribute("data-loaded","1");box.innerHTML=threadHtml(t,chase);})
      .catch(function(){box.innerHTML='<div class="d" style="color:var(--amb)">Couldn\'t reach it — try again.</div>';});
  });

  // The ask bar IS the chat on this page — there's no floating bubble here, and
  // it opens rather than toggles. Tapping the input used to fire focus AND
  // click, which opened the panel twice on a phone (Max, 31 Jul).
  function openChat(){ if(window.avaChat) avaChat.open(true); }
  document.getElementById("askbox").addEventListener("click",function(e){
    if(e.target.closest("#micbtn"))return;   // the mic has its own job
    openChat();
  });
  document.getElementById("askin").addEventListener("focus",function(){this.blur();});
  // Mic: open the chat and start recording straight away, so a voice note is
  // one tap from the home screen.
  document.getElementById("micbtn").addEventListener("click",function(e){
    e.stopPropagation();
    if(!window.avaChat){return;}
    avaChat.open(false);
    var m=document.getElementById("avacmic");
    if(m&&!avaChat.recording())setTimeout(function(){m.click();},80);
  });

  // Under-construction notice: honest by default, gone once they've read it.
  try{ if(localStorage.getItem("ava_wip_today")==="1")document.getElementById("wip").style.display="none"; }catch(e){}
  document.getElementById("wipx").addEventListener("click",function(){
    document.getElementById("wip").style.display="none";
    try{ localStorage.setItem("ava_wip_today","1"); }catch(e){}
  });

  fetch(API+"/ava-triage?company="+CO).then(function(r){return r.json();}).then(render)
    .catch(function(){render(null);});
})();
</script>
<script>window.AVA_CHAT_NO_BUBBLE=true;</script>
<script src="ava-chat.js"></script>
<script src="ava-nav.js"></script>
</body>
</html>
