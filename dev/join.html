<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Elastic</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAF8F4;--line:#D9D9CC;--ink:#141418;--ink2:#67676E;--ink3:#9CA3AF;--ind:#534AB7;--ind2:#6F66DB;--indtx:#3F3795;--grn:#0E7A50;--red:#B42318}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:430px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:32px 30px;box-shadow:0 12px 40px rgba(20,20,24,.06)}
.logo{width:46px;height:46px;border-radius:8px;background:linear-gradient(135deg,var(--ind),var(--ind2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:20px;margin-bottom:16px}
h1{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-bottom:5px}
.sub{font-size:13.5px;color:var(--ink2);line-height:1.55;margin-bottom:20px}
label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:14px 0 5px}
input{width:100%;border:1px solid var(--line);border-radius:4px;padding:11px 12px;font-family:inherit;font-size:14px}
input:focus{outline:none;border-color:var(--ind2)}
.btn{width:100%;margin-top:20px;font-family:inherit;font-size:14.5px;font-weight:600;padding:13px;border-radius:6px;border:0;background:#FF6A1A;color:#fff;cursor:pointer}
.btn:hover{background:#D2530F}
.btn:disabled{opacity:.6;cursor:default}
.msg{font-size:12.5px;margin-top:12px;min-height:16px;color:var(--ink2)}
.msg.err{color:var(--red)}
.fine{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:18px}
.done{text-align:center;padding:8px 0}
.done .tick{width:52px;height:52px;border-radius:50%;background:#E7F6EE;color:var(--grn);font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">E</div>
  <div id="body"><div class="sub">Checking your invite…</div></div>
</div>

<script>
var API="https://somgalhkmptkclgvxhca.supabase.co/functions/v1";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
var TOKEN=new URLSearchParams(location.search).get("i")||"";
var APP=location.href.replace(/join\.html.*$/,"app.html");
var el=function(id){return document.getElementById(id);};

function dead(title,text){
  el("body").innerHTML='<h1>'+esc(title)+'</h1><div class="sub">'+esc(text)+'</div>';
}
function form(inv){
  el("body").innerHTML=
    '<h1>'+esc(inv.partner_name)+' is setting up your books</h1>'
    +'<div class="sub">Confirm your details and we\'ll open your board — every receipt matched to the right spend, missing paperwork chased for you.</div>'
    +'<label>Business name</label><input id="f-biz" value="'+esc(inv.client_name||"")+'">'
    +'<label>Your name</label><input id="f-name" placeholder="First and last name">'
    +'<label>Your email</label><input id="f-email" type="email" value="'+esc(inv.email||"")+'" placeholder="you@yourbusiness.com">'
    +'<label>Phone <span style="font-weight:400;color:var(--ink3)">(optional)</span></label><input id="f-phone" placeholder="021 …">'
    +'<button class="btn" id="f-go">Open my board</button>'
    +'<div class="msg" id="f-msg"></div>'
    +'<div class="fine">Your sign-in link arrives by email — no password to remember. Read-only where it counts: nothing is ever sent or edited in your inbox.</div>';
  el("f-go").addEventListener("click",submit);
}
function submit(){
  var biz=el("f-biz").value.trim(),name=el("f-name").value.trim(),email=el("f-email").value.trim().toLowerCase(),phone=el("f-phone").value.trim();
  var m=el("f-msg");m.className="msg err";
  if(!biz){m.textContent="Business name first.";return;}
  if(!name){m.textContent="Your name too.";return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){m.textContent="That email doesn't look right.";return;}
  var b=el("f-go");b.disabled=true;b.textContent="Setting up…";
  fetch(API+"/partner-desk",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({action:"accept",invite:TOKEN,business:{name:biz,owner_name:name,owner_email:email,phone:phone},redirect:APP})})
    .then(function(r){return r.json();}).then(function(d){
      if(d&&d.error){b.disabled=false;b.textContent="Open my board";m.textContent=d.error;return;}
      // The board is made either way. Only promise email we know went out —
      // sign_in_sent is false when the send was rejected, and telling someone
      // to check an inbox that will never receive anything just strands them.
      if(d&&d.sign_in_sent===false){
        el("body").innerHTML='<div class="done"><div class="tick">✓</div><h1>Board created — but we couldn\'t email you</h1>'
          +'<div class="sub">Your '+esc(biz)+' board is ready, but the sign-in link to <b>'+esc(email)+'</b> wouldn\'t send. '
          +'Email <b>max@elasticadmin.com</b> and we\'ll get you in — we\'ve been told too.</div></div>';
        return;
      }
      el("body").innerHTML='<div class="done"><div class="tick">✓</div><h1>You\'re in — check your email</h1>'
        +'<div class="sub">Your sign-in link is on its way to <b>'+esc(email)+'</b> — check your junk folder if it\'s not there in a minute. It signs you straight in to the '+esc(biz)+' board — connect your Gmail and Xero there and the books start sorting themselves.</div></div>';
    })
    .catch(function(){b.disabled=false;b.textContent="Open my board";m.textContent="Something hiccuped — try again.";});
}
if(!TOKEN){dead("This link isn't complete","Ask whoever sent it for a fresh invite link.");}
else fetch(API+"/partner-desk?invite="+encodeURIComponent(TOKEN)).then(function(r){return r.json();}).then(function(d){
  if(!d||d.error){dead("Invite not found","This link doesn't match an invite. Ask whoever sent it for a fresh one.");return;}
  var inv=d.invite;
  if(inv.status==="accepted"){dead("Already set up","This invite was already used. Sign in from your email link, or ask for a fresh invite.");return;}
  if(inv.status==="revoked"){dead("Invite withdrawn","This invite was cancelled. Ask "+(inv.partner_name||"the Elastic team")+" for a new one.");return;}
  if(inv.status==="expired"){dead("Invite expired","Invites last 14 days. Ask "+(inv.partner_name||"the Elastic team")+" to send a fresh one.");return;}
  form(inv);
}).catch(function(){dead("Couldn't check the invite","Give it a minute and reload this page.");});
</script>
</body>
</html>
