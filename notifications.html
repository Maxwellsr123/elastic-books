<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications — Elastic Admin</title>
<script>window.IS_DEV=/(^|\/)dev(\/|$)/.test(location.pathname)||new URLSearchParams(location.search).get("env")==="dev";if(window.IS_DEV)document.addEventListener("DOMContentLoaded",function(){document.title="DEV · "+document.title;});</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
  :root{--ind:#534AB7;--ind2:#6F66DB;--ink:#141418;--ink2:#67676e;--ink3:#9CA3AF;--bg:#FFFFFF;--line:#D9D9CC;--card:#fff;--grn:#0e7a50;--grnbg:#e7f6ee;--amber:#92400E;--amberbg:#FEF3C7}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
  .wrap{max-width:720px;margin:0 auto;padding:26px 20px 60px}
  h1{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--ink2);font-size:13.5px;margin:0 0 22px;line-height:1.6}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:17px 19px;margin-bottom:14px}
  .fn{font-weight:700;font-size:15px}
  .what{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.55}
  .person{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid #EFEFE8;cursor:pointer}
  .person:last-of-type{border-bottom:0}
  .person input[type=checkbox]{width:17px;height:17px;accent-color:var(--ind);cursor:pointer;flex:none}
  .pemail{font-size:13.5px;font-weight:600;word-break:break-all}
  .pmeta{font-size:11.5px;color:var(--ink3);margin-top:1px}
  .off .pemail{color:var(--ink3);font-weight:500;text-decoration:line-through}
  .addrow{display:flex;gap:8px;margin-top:13px;align-items:center;flex-wrap:wrap}
  .addrow input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:3px;padding:9px 11px;font:inherit;font-size:13px;outline:none}
  .addrow input:focus{border-color:var(--ind)}
  .btn{font:inherit;font-size:12.5px;font-weight:700;padding:9px 15px;border:0;border-radius:3px;background:var(--ind);color:#fff;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#463DA4}
  .btn[disabled]{opacity:.55;cursor:default}
  .msg{font-size:12px;margin-top:9px;min-height:15px;color:var(--ink2)}
  .warn{background:var(--amberbg);color:var(--amber);border-radius:3px;padding:8px 11px;font-size:12.5px;margin-top:11px;line-height:1.5;display:none}
  .slackline{font-size:12px;color:var(--ink3);margin-top:13px}
  .empty{color:var(--ink3);font-size:13px}
  .savebar{display:flex;align-items:center;gap:10px;margin-top:14px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Notifications</h1>
    <p class="sub">One list for everything Ava emails — the 8am &ldquo;your books today&rdquo; rundown, Auto Collect updates, the lot. Tick who should get them, untick who shouldn&rsquo;t, and add anyone who isn&rsquo;t here (like your bookkeeper). It applies to every feature.</p>
    <div id="card" class="card"><span class="empty">Loading…</span></div>
    <div id="fromcard" class="card"><span class="empty">Loading…</span></div>
  </div>

<script>
(function(){
  var API="https://somgalhkmptkclgvxhca.supabase.co/functions/v1";
  var CO=(new URLSearchParams(location.search).get("c"))||(function(){
    try{var s=JSON.parse(localStorage.getItem("ava_session")||"null");if(s&&s.companies&&s.companies.length)return s.companies[0].id;}catch(e){}
    location.replace("app.html");return "";})();
  function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  var SRC={owner:"owner",bookkeeper:"bookkeeper",added:"added here"};
  var PEOPLE=[]; // [{email,name,source,on}]

  function paint(){
    var card=document.getElementById("card");
    var rows=PEOPLE.map(function(p,ix){
      return '<label class="person'+(p.on?'':' off')+'">'
        +'<input type="checkbox" data-ix="'+ix+'"'+(p.on?' checked':'')+'>'
        +'<span style="flex:1"><span class="pemail">'+esc(p.email)+'</span>'
        +'<div class="pmeta">'+esc(p.name?p.name+" · ":"")+esc(SRC[p.source]||p.source)+(p.on?'':' · won’t be emailed')+'</div></span>'
        +'</label>';
    }).join("");
    card.innerHTML='<span class="fn">Who gets Ava’s emails</span>'
      +'<div class="what">Everyone ticked gets every email update.</div>'
      +'<div style="margin-top:9px">'+(rows||'<div class="empty" style="padding:10px 2px">Nobody yet — add an email below.</div>')+'</div>'
      +'<div class="warn" id="warnnone"><i class="ti ti-alert-triangle" style="vertical-align:-2px"></i> Nobody ticked — Ava will stop emailing this company entirely. Slack still works.</div>'
      +'<div class="addrow"><input type="email" id="addin" placeholder="name@example.com"><button class="btn" id="addbtn">Add email</button></div>'
      +'<div class="savebar"><button class="btn" id="savebtn">Save</button><span class="msg" id="msg"></span></div>'
      +'<div class="slackline">Slack channel updates stay on regardless — email is a copy, not a replacement.</div>';
    var w=document.getElementById("warnnone");
    if(w)w.style.display=PEOPLE.length&&!PEOPLE.some(function(p){return p.on;})?"block":"none";
    paintFrom();
  }
  // Which inbox Ava SENDS from — supplier asks, invoice chases, the lot.
  var SENDF=null,SENDC=[];
  function paintFrom(){
    var card=document.getElementById("fromcard");if(!card)return;
    if(!SENDC.length){card.innerHTML='<span class="fn">Where Ava\'s emails come from</span><div class="what">Connect a Gmail inbox with send permission and it appears here.</div>';return;}
    var eff=SENDF||SENDC[0];
    card.innerHTML='<span class="fn">Where Ava\'s emails come from</span>'
      +'<div class="what">Supplier asks and invoice chases send from this inbox, so customers see your address, not Ava\'s.</div>'
      +'<div style="margin-top:9px">'+SENDC.map(function(em){
        return '<label class="person"><input type="radio" name="sfrom" value="'+esc(em)+'"'+(em===eff?' checked':'')+' style="width:16px;height:16px;accent-color:var(--ind);flex:none;cursor:pointer">'
          +'<span class="pemail">'+esc(em)+'</span>'+(em===eff&&!SENDF?'<span class="pmeta" style="margin-left:auto">current default</span>':'')+'</label>';
      }).join("")+'</div>'
      +'<div class="savebar"><button class="btn" id="fromsave">Save</button><span class="msg" id="frommsg"></span></div>';
  }
  function load(){
    fetch(API+"/features?company="+CO).then(function(r){return r.json();}).then(function(d){
      PEOPLE=(d&&d.notify&&d.notify.candidates)||[];
      SENDF=(d&&d.notify&&d.notify.send_from)||null;
      SENDC=(d&&d.notify&&d.notify.send_candidates)||[];
      paint();
    }).catch(function(){document.getElementById("card").innerHTML='<span class="empty">Couldn’t load — refresh to retry.</span>';});
  }
  document.addEventListener("change",function(e){
    var cb=e.target.closest&&e.target.closest('input[type=checkbox][data-ix]');
    if(cb){var p=PEOPLE[parseInt(cb.getAttribute("data-ix"),10)];if(p){p.on=cb.checked;paint();}}
  });
  document.addEventListener("click",function(e){
    if(e.target.closest&&e.target.closest("#addbtn")){
      var input=document.getElementById("addin"),msg=document.getElementById("msg");
      var v=(input&&input.value||"").trim().toLowerCase();
      if(!v){if(msg)msg.textContent="Type an email first.";return;}
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){if(msg)msg.textContent="That email doesn’t look right.";return;}
      if(PEOPLE.some(function(p){return p.email===v;})){if(msg)msg.textContent="Already on the list.";return;}
      PEOPLE.push({email:v,name:"",source:"added",on:true});paint();
      return;
    }
    if(e.target.closest&&e.target.closest("#fromsave")){
      var sel=document.querySelector('input[name="sfrom"]:checked');
      var fm=document.getElementById("frommsg");
      if(!sel){if(fm)fm.textContent="Pick an inbox first.";return;}
      if(fm)fm.textContent="Saving…";
      var ses2=null;try{ses2=JSON.parse(localStorage.getItem("ava_session")||"null");}catch(err2){}
      fetch(API+"/features",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({company_id:CO,send_from:sel.value,by:(ses2&&ses2.email)||"owner"})})
        .then(function(r){return r.json();})
        .then(function(d){if(d&&d.notify){SENDF=d.notify.send_from;SENDC=d.notify.send_candidates||SENDC;paintFrom();var f2=document.getElementById("frommsg");if(f2)f2.textContent="Saved — Ava sends from "+(SENDF||SENDC[0])+" now.";}
          else{var f3=document.getElementById("frommsg");if(f3)f3.textContent=(d&&d.error)||"Didn't save — try again.";}})
        .catch(function(){var f4=document.getElementById("frommsg");if(f4)f4.textContent="Couldn't reach it — try again.";});
      return;
    }
    if(e.target.closest&&e.target.closest("#savebtn")){
      var btn=document.getElementById("savebtn"),m=document.getElementById("msg");
      btn.disabled=true;if(m)m.textContent="Saving…";
      var sess=null;try{sess=JSON.parse(localStorage.getItem("ava_session")||"null");}catch(err){}
      fetch(API+"/features",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({company_id:CO,notify_all:PEOPLE.filter(function(p){return p.on;}).map(function(p){return p.email;}),by:(sess&&sess.email)||"owner"})})
        .then(function(r){return r.json();})
        .then(function(d){
          if(d&&d.notify){PEOPLE=d.notify.candidates||PEOPLE;paint();var m2=document.getElementById("msg");if(m2)m2.textContent="Saved — Ava emails exactly this list now.";}
          else{var m3=document.getElementById("msg");if(m3)m3.textContent=(d&&d.error)||"Didn’t save — try again.";document.getElementById("savebtn").disabled=false;}
        })
        .catch(function(){var m4=document.getElementById("msg");if(m4)m4.textContent="Couldn’t reach it — try again.";document.getElementById("savebtn").disabled=false;});
    }
  });
  load();
})();
</script>
<script src="ava-nav.js"></script>
</body>
</html>
